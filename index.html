<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אפליקציית המתכונים שלי</title>
  <style>
    :root {
      --primary-color: #e67e22;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding-bottom: 70px;
    }
    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #ddd;
      padding: 10px 0;
    }
    nav button {
      background: none;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      color: #777;
    }
    nav button.active {
      color: var(--primary-color);
      font-weight: bold;
    }
    .page { display: none; padding: 15px; }
    .page.active { display: block; }
    
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      position: relative;
    }
    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }
    .card-content { padding: 10px; }
    .card-title { font-weight: bold; margin-bottom: 5px; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 0.75rem;
      border-radius: 4px;
      color: white;
    }
    .badge-dairy { background-color: #3498db; }
    .badge-meat { background-color: #e74c3c; }
    .badge-parve { background-color: #2ecc71; }

    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button.btn-main {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .ingredient-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .ingredient-row input[type="checkbox"] { width: auto; }
  </style>
</head>
<body>

  <header id="header-title">אפליקציית המתכונים שלי</header>

  <!-- דף הבית -->
  <div id="page-home" class="page active">
    <h3>קטגוריות</h3>
    <select id="filter-category" onchange="renderHome()">
      <option value="all">כל הקטגוריות</option>
      <option value="בישול">בישול</option>
      <option value="קינוחים">קינוחים</option>
      <option value="בריא">בריא</option>
      <option value="ללא גלוטן">ללא גלוטן</option>
    </select>
    
    <div id="recipes-grid" class="card-grid"></div>
  </div>

  <!-- דף הוספת/עריכת מתכון -->
  <div id="page-add" class="page">
    <h2>הוספת מתכון חדש</h2>
    
    <label>מפתח Gemini API (פענוח טקסט/תמונה):</label>
    <input type="password" id="api-key" placeholder="הכנס מפתח API לפענוח אוטומטי">

    <label>ייבוא מטקסט/תמונות מרובות:</label>
    <textarea id="import-text" placeholder="הדבק כאן טקסט מאינסטגרם/טיקטוק..."></textarea>
    <label>או העלה תמונות מתכון:</label>
    <input type="file" id="import-images" multiple accept="image/*">
    <button class="btn-main" onclick="parseWithAI()">ניתוח אוטומטי בעזרת AI</button>
    <hr>

    <input type="text" id="recipe-title" placeholder="שם המתכון">
    <input type="text" id="recipe-desc" placeholder="תיאור קצר">
    <label>תמונה ראשית (כתובת URL או העלאת קובץ):</label>
    <input type="file" id="recipe-img-file" accept="image/*">
    
    <label>קטגוריה:</label>
    <select id="recipe-category">
      <option value="בישול">בישול</option>
      <option value="קינוחים">קינוחים</option>
      <option value="בריא">בריא</option>
      <option value="ללא גלוטן">ללא גלוטן</option>
    </select>

    <label>סוג המתכון:</label>
    <select id="recipe-type">
      <option value="פרווה">פרווה</option>
      <option value="חלבי">חלבי</option>
      <option value="בשרי">בשרי</option>
    </select>

    <label>מצרכים (שורה לכל מצרך):</label>
    <textarea id="recipe-ingredients" rows="5"></textarea>

    <label>אופן ההכנה (שורה לכל שלב):</label>
    <textarea id="recipe-steps" rows="5"></textarea>

    <button class="btn-main" onclick="saveRecipe()">שמור מתכון</button>
  </div>

  <!-- דף צפייה במתכון -->
  <div id="page-view" class="page">
    <button onclick="showPage('home')">← חזרה לדף הבית</button>
    <h2 id="view-title"></h2>
    <img id="view-img" src="" style="width:100%; max-height:250px; object-fit:cover; border-radius:8px;">
    <p id="view-desc" style="font-style:italic;"></p>
    <span id="view-type" class="badge"></span>
    
    <h3>מצרכים:</h3>
    <div id="view-ingredients"></div>
    <button class="btn-main" style="margin-top:10px;" onclick="addMissingToShopping()">הוסף מצרכים מסומנים לרשימת הקניות</button>

    <h3>אופן הכנה:</h3>
    <ol id="view-steps"></ol>

    <button style="background:#e74c3c; color:white;" onclick="deleteCurrentRecipe()">מחק מתכון</button>
  </div>

  <!-- דף רשימת קניות והמרות -->
  <div id="page-tools" class="page">
    <h2>רשימת קניות</h2>
    <div style="display:flex; gap:5px;">
      <input type="text" id="new-shop-item" placeholder="הוסף מוצר...">
      <button style="width:80px;" class="btn-main" onclick="addManualShopItem()">הוסף</button>
    </div>
    <ul id="shopping-list" style="list-style:none; padding:0;"></ul>

    <hr>
    <h2>מחשבון המרות</h2>
    <label>רכיב:</label>
    <select id="convert-ingredient">
      <option value="flour">קמח (1 כוס = 140 גרם)</option>
      <option value="sugar">סוכר (1 כוס = 200 גרם)</option>
      <option value="oil">שמן (1 כוס = 200 מ"ל)</option>
      <option value="water">מים/חלב (1 כוס = 240 מ"ל)</option>
      <option value="powdered_sugar">אבקת סוכר (1 כוס = 120 גרם)</option>
    </select>

    <label>כמות בכוסות:</label>
    <input type="number" id="convert-cups" placeholder="לדוגמה: 0.5" oninput="calculateConversion()">

    <h3 id="convert-result">תוצאה: 0 גרם / מ"ל</h3>
  </div>

  <!-- ניווט תחתון -->
  <nav>
    <button id="nav-home" class="active" onclick="showPage('home')">🏠 דף הבית</button>
    <button id="nav-add" onclick="showPage('add')">➕ הוספת מתכון</button>
    <button id="nav-tools" onclick="showPage('tools')">🛒 קניות והמרות</button>
  </nav>

  <script>
    let recipes = JSON.parse(localStorage.getItem('recipes') || '[]');
    let shoppingList = JSON.parse(localStorage.getItem('shoppingList') || '[]');
    let currentRecipeId = null;

    function saveToStorage() {
      localStorage.setItem('recipes', JSON.stringify(recipes));
      localStorage.setItem('shoppingList', JSON.stringify(shoppingList));
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + pageId).classList.add('active');
      document.getElementById('nav-' + pageId)?.classList.add('active');
      
      if(pageId === 'home') renderHome();
      if(pageId === 'tools') renderShoppingList();
    }

    function renderHome() {
      const grid = document.getElementById('recipes-grid');
      const categoryFilter = document.getElementById('filter-category').value;
      grid.innerHTML = '';

      const filtered = categoryFilter === 'all' ? recipes : recipes.filter(r => r.category === categoryFilter);

      filtered.forEach(r => {
        const badgeClass = r.type === 'חלבי' ? 'badge-dairy' : r.type === 'בשרי' ? 'badge-meat' : 'badge-parve';
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openRecipe(r.id);
        card.innerHTML = `
          <img src="${r.img || 'https://via.placeholder.com/150'}" alt="${r.title}">
          <div class="card-content">
            <div class="card-title">${r.title}</div>
            <span class="badge ${badgeClass}">${r.type || 'פרווה'}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function saveRecipe() {
      const title = document.getElementById('recipe-title').value;
      if (!title) return alert('נא להזין שם מתכון');

      const imgInput = document.getElementById('recipe-img-file');
      
      const processSave = (imgBase64) => {
        const recipe = {
          id: Date.now(),
          title,
          desc: document.getElementById('recipe-desc').value,
          category: document.getElementById('recipe-category').value,
          type: document.getElementById('recipe-type').value,
          ingredients: document.getElementById('recipe-ingredients').value.split('\n').filter(i => i.trim()),
          steps: document.getElementById('recipe-steps').value.split('\n').filter(s => s.trim()),
          img: imgBase64 || ''
        };

        recipes.push(recipe);
        saveToStorage();
        alert('המתכון נשמר בהצלחה!');
        showPage('home');
      };

      if (imgInput.files && imgInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => processSave(e.target.result);
        reader.readAsDataURL(imgInput.files[0]);
      } else {
        processSave('');
      }
    }

    function openRecipe(id) {
      currentRecipeId = id;
      const r = recipes.find(item => item.id === id);
      if(!r) return;

      document.getElementById('view-title').innerText = r.title;
      document.getElementById('view-desc').innerText = r.desc || '';
      document.getElementById('view-img').src = r.img || 'https://via.placeholder.com/300';
      
      const typeBadge = document.getElementById('view-type');
      typeBadge.innerText = r.type || 'פרווה';
      typeBadge.className = 'badge ' + (r.type === 'חלבי' ? 'badge-dairy' : r.type === 'בשרי' ? 'badge-meat' : 'badge-parve');

      const ingDiv = document.getElementById('view-ingredients');
      ingDiv.innerHTML = '';
      r.ingredients.forEach((ing, index) => {
        ingDiv.innerHTML += `
          <div class="ingredient-row">
            <input type="checkbox" id="ing-${index}" value="${ing}">
            <label for="ing-${index}">${ing}</label>
          </div>
        `;
      });

      const stepsOl = document.getElementById('view-steps');
      stepsOl.innerHTML = '';
      r.steps.forEach(step => {
        stepsOl.innerHTML += `<li>${step}</li>`;
      });

      showPage('view');
    }

    function deleteCurrentRecipe() {
      if(confirm('בטוח שברצונך למחוק מתכון זה?')) {
        recipes = recipes.filter(r => r.id !== currentRecipeId);
        saveToStorage();
        showPage('home');
      }
    }

    function addMissingToShopping() {
      const checkboxes = document.querySelectorAll('#view-ingredients input[type="checkbox"]');
      let addedCount = 0;
      checkboxes.forEach(cb => {
        if(cb.checked) { // מסומן מה שחסר
          shoppingList.push({ id: Date.now() + Math.random(), text: cb.value, done: false });
          addedCount++;
        }
      });
      saveToStorage();
      alert(`נוספו ${addedCount} מצרכים לרשימת הקניות!`);
    }

    function renderShoppingList() {
      const ul = document.getElementById('shopping-list');
      ul.innerHTML = '';
      shoppingList.forEach((item, index) => {
        ul.innerHTML += `
          <li style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:white; padding:8px; border-radius:5px;">
            <span style="${item.done ? 'text-decoration:line-through; color:gray;' : ''}" onclick="toggleShopItem(${index})">${item.text}</span>
            <button style="width:auto; margin:0; background:#e74c3c; color:white;" onclick="deleteShopItem(${index})">✕</button>
          </li>
        `;
      });
    }

    function addManualShopItem() {
      const input = document.getElementById('new-shop-item');
      if(input.value.trim()) {
        shoppingList.push({ id: Date.now(), text: input.value.trim(), done: false });
        input.value = '';
        saveToStorage();
        renderShoppingList();
      }
    }

    function toggleShopItem(index) {
      shoppingList[index].done = !shoppingList[index].done;
      saveToStorage();
      renderShoppingList();
    }

    function deleteShopItem(index) {
      shoppingList.splice(index, 1);
      saveToStorage();
      renderShoppingList();
    }

    function calculateConversion() {
      const type = document.getElementById('convert-ingredient').value;
      const cups = parseFloat(document.getElementById('convert-cups').value) || 0;
      let ratio = 140; // ברירת מחדל קמח

      if (type === 'sugar') ratio = 200;
      if (type === 'oil') ratio = 200;
      if (type === 'water') ratio = 240;
      if (type === 'powdered_sugar') ratio = 120;

      const total = cups * ratio;
      const unit = (type === 'oil' || type === 'water') ? 'מ"ל' : 'גרם';
      document.getElementById('convert-result').innerText = `תוצאה: ${total} ${unit}`;
    }

    // ניתוח AI באמצעות Gemini API
    async function parseWithAI() {
      const apiKey = document.getElementById('api-key').value;
      const text = document.getElementById('import-text').value;
      const fileInput = document.getElementById('import-images');

      if (!apiKey) return alert('נא להזין מפתח Gemini API');

      let prompt = "חלץ מהטקסט/תמונות את המתכון והחזר JSON בלבד במבנה הבא: {\"title\": \"\", \"desc\": \"\", \"ingredients\": [\"\"], \"steps\": [\"\"]}";
      
      // כאן ניתן לצרף את בקשת ה-Fetch ל-Gemini API
      alert("פונקציונליות ה-AI מוכנה לחיבור המפתח שלך!");
    }
  </script>
</body>
</html>
