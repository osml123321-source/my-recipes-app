<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אפליקציית המתכונים שלי</title>
    <!-- Tailwind CSS לייצוב מהיר -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js לסריקת טקסט מתמונות (OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-12">

    <!-- כותרת ראשית -->
    <header class="bg-orange-500 text-white py-6 shadow-md mb-8">
        <div class="container mx-auto text-center">
            <h1 class="text-3xl font-bold">ספר המתכונים שלי</h1>
            <p class="text-sm opacity-90 mt-1">ניהול, סריקת תמונות וסינון מתכונים בקלות</p>
        </div>
    </header>

    <main class="container mx-auto px-4 space-y-8">

        <!-- ========================================== -->
        <!-- 1. אזור סריקת תמונות מרובות (OCR)          -->
        <!-- ========================================== -->
        <section class="bg-white p-6 rounded-lg shadow-md max-w-3xl mx-auto">
            <h2 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">📸 סריקת מתכון מתמונות</h2>
            
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">בחר תמונה אחת או יותר לסריקה:</label>
                <input type="file" id="imageInput" accept="image/*" multiple 
                       onchange="handleImageSelection(event)" 
                       class="block w-full text-sm text-gray-500 file:ml-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 cursor-pointer">
            </div>

            <!-- רשימת התמונות שנבחרו לבחירת קטגוריה -->
            <div id="imageList" class="space-y-3 mb-4"></div>

            <button id="scanBtn" onclick="processAllImages()" disabled 
                    class="w-full bg-orange-500 text-white font-bold py-2.5 px-4 rounded shadow hover:bg-orange-600 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors">
                סרוק תמונות והכנס לטופס
            </button>

            <div id="scanProgress" class="hidden mt-4 text-center text-sm font-semibold text-orange-600 animate-pulse"></div>
        </section>

        <!-- ========================================== -->
        <!-- 2. טופס הוספת / עריכת מתכון                 -->
        <!-- ========================================== -->
        <section class="bg-white p-6 rounded-lg shadow-md max-w-3xl mx-auto space-y-4">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-2">📝 פרטי המתכון</h2>
            
            <div>
                <label class="block text-gray-700 font-bold mb-1">שם המתכון:</label>
                <input type="text" id="recipeTitle" placeholder="לדוגמה: עוגת שוקולד חמה" class="w-full p-2 border rounded border-gray-300 focus:ring-2 focus:ring-orange-400 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- בחירת קטגוריה -->
                <div>
                    <label class="block text-gray-700 font-bold mb-1">קטגוריה:</label>
                    <select id="recipeCategory" class="w-full p-2 border rounded border-gray-300 bg-white focus:ring-2 focus:ring-orange-400 focus:outline-none">
                        <option value="cooking">בישול</option>
                        <option value="baking">אפייה</option>
                        <option value="desserts">קינוחים</option>
                        <option value="salads">סלטים</option>
                        <option value="soups">מרקים</option>
                    </select>
                </div>

                <!-- בחירת סוג כשרות -->
                <div>
                    <label class="block text-gray-700 font-bold mb-1">סוג כשרות:</label>
                    <select id="recipeKosher" class="w-full p-2 border rounded border-gray-300 bg-white focus:ring-2 focus:ring-orange-400 focus:outline-none">
                        <option value="dairy">🥛 חלבי</option>
                        <option value="meat">🥩 בשרי</option>
                        <option value="pareve">🌱 פרווה</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-1">רכיבים:</label>
                <textarea id="ingredientsText" rows="4" class="w-full p-2 border rounded border-gray-300 focus:ring-2 focus:ring-orange-400 focus:outline-none" placeholder="הרכיבים ייסרקו לכאן או הוסף אותם ידנית..."></textarea>
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-1">אופן הכנה:</label>
                <textarea id="instructionsText" rows="5" class="w-full p-2 border rounded border-gray-300 focus:ring-2 focus:ring-orange-400 focus:outline-none" placeholder="אופן ההכנה ייסרק לכאן או הוסף אותו ידנית..."></textarea>
            </div>

            <button onclick="saveRecipe()" class="w-full bg-green-600 text-white font-bold py-2.5 px-4 rounded shadow hover:bg-green-700 transition-colors">
                שמור מתכון
            </button>
        </section>

        <!-- ========================================== -->
        <!-- 3. סרגל סינון וחיפוש                       -->
        <!-- ========================================== -->
        <section class="bg-white p-4 rounded-lg shadow-md max-w-3xl mx-auto">
            <h3 class="text-lg font-bold text-gray-800 mb-3">🔍 סינון מתכונים</h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">חיפוש לפי שם:</label>
                    <input type="text" id="filterSearchInput" oninput="applyFilters()" placeholder="חפש מתכון..." 
                           class="w-full p-2 text-sm border rounded border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">קטגוריה:</label>
                    <select id="filterCategory" onchange="applyFilters()" class="w-full p-2 text-sm border rounded border-gray-300 bg-white focus:outline-none focus:ring-2 focus:ring-orange-400">
                        <option value="all">כל הקטגוריות</option>
                        <option value="cooking">בישול</option>
                        <option value="baking">אפייה</option>
                        <option value="desserts">קינוחים</option>
                        <option value="salads">סלטים</option>
                        <option value="soups">מרקים</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">סוג כשרות:</label>
                    <select id="filterKosher" onchange="applyFilters()" class="w-full p-2 text-sm border rounded border-gray-300 bg-white focus:outline-none focus:ring-2 focus:ring-orange-400">
                        <option value="all">הכל (חלבי / בשרי / פרווה)</option>
                        <option value="dairy">🥛 חלבי</option>
                        <option value="meat">🥩 בשרי</option>
                        <option value="pareve">🌱 פרווה</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- 4. תצוגת רשימת המתכונים                   -->
        <!-- ========================================== -->
        <section id="recipesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto"></section>

    </main>

    <!-- ========================================== -->
    <!-- לוגיקת JavaScript                         -->
    <!-- ========================================== -->
    <script>
        // ניהול תמונות לסריקה
        let selectedFilesData = [];

        // מאגר מתכונים ראשוני
        let recipes = [
            {
                id: 1,
                title: "פסטה ברוטב שמנת ופטריות",
                category: "cooking",
                kosher: "dairy",
                ingredients: "פסטה, שמנת מתוקה, פטריות, שום, פרמזן",
                instructions: "מבשלים את הפסטה, מטגנים פטריות ושום, מוסיפים שמנת ומביאים לרתיחה."
            },
            {
                id: 2,
                title: "עוגת שוקולד פרווה",
                category: "desserts",
                kosher: "pareve",
                ingredients: "קמח, סוכר, קקאו, שמן, מים, אבקת אפייה",
                instructions: "מערבבים את כל החומרים, יוצקים לתבנית ואופים ב-180 מעלות כ-30 דקות."
            },
            {
                id: 3,
                title: "צלי בקר בתנור",
                category: "cooking",
                kosher: "meat",
                ingredients: "נתח בקר, בצל, גזר, יין אדום, תבלינים",
                instructions: "צולים את הבקר מכל הצדדים, מוסיפים ירקות ויין, ואופים בחום נמוך שעתיים."
            }
        ];

        const kosherBadges = {
            dairy: '<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-blue-300">🥛 חלבי</span>',
            meat: '<span class="bg-red-100 text-red-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-red-300">🥩 בשרי</span>',
            pareve: '<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-green-300">🌱 פרווה</span>'
        };

        const categoryNames = {
            cooking: 'בישול',
            baking: 'אפייה',
            desserts: 'קינוחים',
            salads: 'סלטים',
            soups: 'מרקים'
        };

        // --- טיפול בהעלאת תמונות מרובות ---
        function handleImageSelection(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            files.forEach(file => {
                selectedFilesData.push({
                    id: Math.random().toString(36).substr(2, 9),
                    file: file,
                    category: 'ingredients'
                });
            });

            renderImageList();
            event.target.value = '';
        }

        function renderImageList() {
            const container = document.getElementById('imageList');
            container.innerHTML = '';

            if (selectedFilesData.length === 0) {
                document.getElementById('scanBtn').disabled = true;
                return;
            }

            document.getElementById('scanBtn').disabled = false;

            selectedFilesData.forEach(item => {
                const card = document.createElement('div');
                card.className = "flex items-center justify-between bg-gray-50 p-3 rounded border border-gray-200";

                card.innerHTML = `
                    <div class="truncate max-w-xs">
                        <span class="text-sm font-medium text-gray-700 truncate">${item.file.name}</span>
                    </div>
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <select onchange="updateCategory('${item.id}', this.value)" class="text-sm border rounded p-1 bg-white">
                            <option value="ingredients" ${item.category === 'ingredients' ? 'selected' : ''}>רכיבים</option>
                            <option value="instructions" ${item.category === 'instructions' ? 'selected' : ''}>אופן הכנה</option>
                            <option value="both" ${item.category === 'both' ? 'selected' : ''}>כללי / משולב</option>
                        </select>
                        <button onclick="removeFile('${item.id}')" class="text-red-500 hover:text-red-700 font-bold px-2 text-lg">&times;</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateCategory(id, newCategory) {
            const item = selectedFilesData.find(f => f.id === id);
            if (item) item.category = newCategory;
        }

        function removeFile(id) {
            selectedFilesData = selectedFilesData.filter(f => f.id !== id);
            renderImageList();
        }

        // --- סריקת OCR ---
        async function processAllImages() {
            if (selectedFilesData.length === 0) return;

            const scanBtn = document.getElementById('scanBtn');
            const progressDiv = document.getElementById('scanProgress');
            
            scanBtn.disabled = true;
            progressDiv.classList.remove('hidden');

            let ingredientsResult = [];
            let instructionsResult = [];

            for (let i = 0; i < selectedFilesData.length; i++) {
                const item = selectedFilesData[i];
                progressDiv.innerText = `סורק תמונה ${i + 1} מתוך ${selectedFilesData.length}...`;

                try {
                    const { data: { text } } = await Tesseract.recognize(
                        item.file,
                        'heb+eng',
                        {
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    const percent = Math.round((m.progress || 0) * 100);
                                    progressDiv.innerText = `סורק תמונה ${i + 1} מתוך ${selectedFilesData.length}: ${percent}%`;
                                }
                            }
                        }
                    );

                    const cleanText = text.trim();

                    if (item.category === 'ingredients') {
                        ingredientsResult.push(cleanText);
                    } else if (item.category === 'instructions') {
                        instructionsResult.push(cleanText);
                    } else if (item.category === 'both') {
                        ingredientsResult.push(cleanText);
                        instructionsResult.push(cleanText);
                    }

                } catch (error) {
                    console.error("שגיאה בסריקה:", error);
                    alert(`אירעה שגיאה בסריקת הקובץ: ${item.file.name}`);
                }
            }

            if (ingredientsResult.length > 0) {
                const currentVal = document.getElementById('ingredientsText').value;
                document.getElementById('ingredientsText').value = (currentVal ? currentVal + '\n\n' : '') + ingredientsResult.join('\n\n');
            }

            if (instructionsResult.length > 0) {
                const currentVal = document.getElementById('instructionsText').value;
                document.getElementById('instructionsText').value = (currentVal ? currentVal + '\n\n' : '') + instructionsResult.join('\n\n');
            }

            progressDiv.innerText = "הסריקה הושלמה בהצלחה!";
            setTimeout(() => { progressDiv.classList.add('hidden'); }, 3000);

            selectedFilesData = [];
            renderImageList();
        }

        // --- שמירת מתכון חדש ---
        function saveRecipe() {
            const title = document.getElementById('recipeTitle').value.trim();
            const category = document.getElementById('recipeCategory').value;
            const kosher = document.getElementById('recipeKosher').value;
            const ingredients = document.getElementById('ingredientsText').value.trim();
            const instructions = document.getElementById('instructionsText').value.trim();

            if (!title) {
                alert('אנא הזן שם למתכון');
                return;
            }

            const newRecipe = {
                id: Date.now(),
                title,
                category,
                kosher,
                ingredients,
                instructions
            };

            recipes.unshift(newRecipe);
            applyFilters();

            // איפוס שדות הטופס
            document.getElementById('recipeTitle').value = '';
            document.getElementById('ingredientsText').value = '';
            document.getElementById('instructionsText').value = '';
            alert('המתכון נשמר בהצלחה!');
        }

        // --- סינון והצגה ---
        function applyFilters() {
            const searchText = document.getElementById('filterSearchInput').value.toLowerCase().trim();
            const selectedCategory = document.getElementById('filterCategory').value;
            const selectedKosher = document.getElementById('filterKosher').value;

            const filteredRecipes = recipes.filter(recipe => {
                const matchesSearch = recipe.title.toLowerCase().includes(searchText);
                const matchesCategory = (selectedCategory === 'all') || (recipe.category === selectedCategory);
                const matchesKosher = (selectedKosher === 'all') || (recipe.kosher === selectedKosher);

                return matchesSearch && matchesCategory && matchesKosher;
            });

            renderRecipes(filteredRecipes);
        }

        function renderRecipes(recipesToDisplay) {
            const container = document.getElementById('recipesContainer');
            container.innerHTML = '';

            if (recipesToDisplay.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-8 font-semibold">לא נמצאו מתכונים המתאימים לסינון הנבחר.</div>`;
                return;
            }

            recipesToDisplay.forEach(recipe => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-lg shadow-md overflow-hidden border border-gray-200 flex flex-col justify-between p-5 hover:shadow-lg transition-shadow";

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="text-lg font-bold text-gray-800">${recipe.title}</h4>
                            <div>${kosherBadges[recipe.kosher] || ''}</div>
                        </div>
                        <div class="text-xs text-gray-500 mb-3 font-medium">
                            קטגוריה: <span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded">${categoryNames[recipe.category] || recipe.category}</span>
                        </div>
                        ${recipe.ingredients ? `
                            <div class="mb-3">
                                <strong class="text-xs text-gray-700 block mb-1">רכיבים:</strong>
                                <p class="text-sm text-gray-600 whitespace-pre-line bg-gray-50 p-2 rounded">${recipe.ingredients}</p>
                            </div>
                        ` : ''}
                        ${recipe.instructions ? `
                            <div>
                                <strong class="text-xs text-gray-700 block mb-1">אופן הכנה:</strong>
                                <p class="text-sm text-gray-600 whitespace-pre-line bg-gray-50 p-2 rounded">${recipe.instructions}</p>
                            </div>
                        ` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // טעינה ראשונית
        document.addEventListener('DOMContentLoaded', () => {
            applyFilters();
        });
    </script>
</body>
</html>
